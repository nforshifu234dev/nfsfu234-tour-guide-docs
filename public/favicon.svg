<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="outerRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="innerRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="centerDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="48" fill="#0d1117" stroke="#1a2a1a" stroke-width="1"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="38" stroke="url(#outerRing)" stroke-width="3.5" fill="none" filter="url(#glow)"/>

  <!-- Middle ring -->
  <circle cx="50" cy="50" r="26" stroke="url(#innerRing)" stroke-width="2.5" fill="none" opacity="0.85"/>

  <!-- Inner ring -->
  <circle cx="50" cy="50" r="14" stroke="#10b981" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Crosshair lines — horizontal -->
  <line x1="10" y1="50" x2="34" y2="50" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="66" y1="50" x2="90" y2="50" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Crosshair lines — vertical -->
  <line x1="50" y1="10" x2="50" y2="34" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="50" y1="66" x2="50" y2="90" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Arrow/cursor pointing at center — the "guide" metaphor -->
  <path d="M 30 28 L 30 50 L 37 43 L 42 54 L 46 52 L 41 41 L 50 41 Z"
        fill="url(#outerRing)"
        filter="url(#glow)"
        stroke="#065f46"
        stroke-width="0.5"
        stroke-linejoin="round"/>

  <!-- Center bullseye dot -->
  <circle cx="50" cy="50" r="4" fill="url(#centerDot)" filter="url(#glow)"/>
</svg>
